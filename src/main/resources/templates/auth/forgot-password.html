<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên Mật Khẩu - Cứu Nạn Thiên Tai</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background-color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: #ffffff; border-radius: 18px; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); max-width: 440px; width: 100%; }
        .auth-icon { width: 68px; height: 68px; background: #fee2e2; color: #dc3545; display: flex; align-items: center; justify-content: center; border-radius: 50%; margin: 0 auto 16px; font-size: 1.85rem; border: 4px solid #fff5f5; }
        .btn-submit { background: #dc3545; border-color: #dc3545; color: #fff; font-weight: 700; padding: 12px; border-radius: 50rem; transition: all 0.2s; }
        .btn-submit:hover { background: #b02a37; border-color: #b02a37; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(220,53,69,0.25); }
    </style>
</head>
<body>

<div class="auth-card p-4 p-sm-5 text-center">
    <div class="auth-icon shadow-sm">
        <i class="bi bi-key-fill"></i>
    </div>

    <h4 class="fw-bold text-dark mb-1">Khôi Phục Mật Khẩu</h4>
    <p class="text-muted small mb-4">Nhập tên đăng nhập của bạn để nhận mã xác thực OTP</p>

    <div th:if="${errorMsg}" class="alert alert-danger py-2 px-3 small border-0 rounded-3 mb-3 text-start d-flex align-items-center gap-2">
        <i class="bi bi-exclamation-triangle-fill text-danger fs-5"></i>
        <span th:text="${errorMsg}">Lỗi tài khoản</span>
    </div>

    <form th:action="@{/auth/forgot-password}" method="post">
        <div class="mb-4 text-start">
            <label class="form-label fw-bold small text-secondary">Tên đăng nhập / Số điện thoại:</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                <input type="text" name="username" class="form-control border-start-0 ps-0" placeholder="VD: user123 hoặc 0912345678" required autofocus>
            </div>
        </div>

        <button type="submit" class="btn btn-submit w-100">
            <i class="bi bi-send-fill me-1"></i> GỬI MÃ XÁC THỰC OTP
        </button>
    </form>

    <div class="mt-4 pt-3 border-top text-center">
        <a href="/auth/login" class="text-secondary small text-decoration-none fw-semibold">
            <i class="bi bi-arrow-left me-1"></i> Quay lại Đăng nhập
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
