<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Hệ Thống Cứu Nạn Khẩn Cấp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card bg-secondary text-white shadow-lg border-0">
                <div class="card-header bg-danger text-center py-3">
                    <h4 class="fw-bold mb-0">🚨 ĐĂNG NHẬP</h4>
                    <small>Hệ Thống Cứu Nạn Thiên Tai</small>
                </div>
                <div class="card-body p-4">
                    <div th:if="${errorMsg}" class="alert alert-danger py-2 small fw-bold text-center" th:text="${errorMsg}"></div>
                    <div th:if="${successMsg}" class="alert alert-success py-2 small fw-bold text-center" th:text="${successMsg}"></div>

                    <form th:action="@{/auth/login}" method="post" th:object="${loginDto}">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Tên đăng nhập:</label>
                            <input type="text" class="form-control bg-dark text-white border-0" th:field="*{username}" placeholder="Nhập username" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Mật khẩu:</label>
                            <input type="password" class="form-control bg-dark text-white border-0" th:field="*{password}" placeholder="Nhập mật khẩu" required>
                        </div>
                        <button type="submit" class="btn btn-danger w-100 fw-bold py-2 shadow">
                            ĐĂNG NHẬP
                        </button>
                    </form>

                    <div class="mt-3 text-center small">
                        <span class="text-light">Chưa có tài khoản?</span>
                        <a href="/auth/register" class="text-warning fw-bold text-decoration-none">Đăng ký ngay</a>
                    </div>
                    <hr class="border-secondary my-3">
                    <div class="small text-muted">
                        <strong>Tài khoản thử nghiệm (pass: 123456):</strong><br>
                        - Admin: <code>admin</code><br>
                        - Manager: <code>manager</code><br>
                        - Công dân: <code>user</code>
                    </div>
                </div>
            </div>
            <div class="text-center mt-3">
                <a href="/map" class="text-light small text-decoration-none">← Quay lại bản đồ cứu nạn công khai</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
