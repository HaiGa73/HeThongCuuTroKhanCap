<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Thực OTP - Kích Hoạt Tài Khoản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .otp-input {
            letter-spacing: 12px;
            font-size: 26px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body class="bg-dark text-white">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card bg-secondary text-white shadow-lg border-0">
                <div class="card-header bg-warning text-dark text-center py-3">
                    <h4 class="fw-bold mb-0">🔐 XÁC THỰC MÃ OTP</h4>
                    <small>Kích hoạt tài khoản cứu hộ</small>
                </div>
                <div class="card-body p-4 text-center">
                    <p class="small text-light mb-3">
                        Mã xác thực 6 chữ số đã được tạo cho tài khoản: 
                        <strong class="text-warning" th:text="${username}">user</strong>
                    </p>

                    <div th:if="${errorMsg}" class="alert alert-danger py-2 small fw-bold" th:text="${errorMsg}"></div>
                    <div th:if="${successMsg}" class="alert alert-success py-2 small fw-bold" th:text="${successMsg}"></div>

                    <form th:action="@{/auth/verify-otp}" method="post">
                        <input type="hidden" name="username" th:value="${username}">

                        <div class="mb-3">
                            <input type="text" name="otp" class="form-control bg-dark text-white border-0 otp-input"
                                   placeholder="------" maxlength="6" pattern="[0-9]{6}" required autofocus>
                            <small class="text-muted d-block mt-2">Mã OTP có hiệu lực trong 5 phút</small>
                        </div>

                        <button type="submit" class="btn btn-warning w-100 fw-bold py-2 shadow">
                            XÁC THỰC VÀ KÍCH HOẠT
                        </button>
                    </form>

                    <hr class="border-secondary my-3">

                    <form th:action="@{/auth/resend-otp}" method="post">
                        <input type="hidden" name="username" th:value="${username}">
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="small text-light">Chưa nhận được mã?</span>
                            <button type="submit" class="btn btn-link text-info text-decoration-none small p-0 fw-bold">
                                Gửi lại mã OTP
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="text-center mt-3">
                <a href="/auth/login" class="text-light small text-decoration-none">← Quay lại trang đăng nhập</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
