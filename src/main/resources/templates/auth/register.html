<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Đăng Ký Tài Khoản - Hệ Thống Cứu Nạn</title>

    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/login-style.css}">

    <style>
        body {
            background: #f4f6f9;
            font-family: "Lato", Arial, sans-serif;
            min-height: 100vh;
        }
        .wrap {
            width: 100%;
            border-radius: 14px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid #e9ecef;
        }
        .img {
            height: 200px;
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center 30%;
            background-color: #fce8e6;
        }
        .login-wrap {
            padding: 2.2rem 2.5rem !important;
        }
        .form-group {
            position: relative;
            margin-bottom: 1.6rem;
        }
        .form-control {
            height: 48px;
            background: #fff;
            color: #495057;
            font-size: 15px;
            border-radius: 6px;
            box-shadow: none;
            border: 1px solid #ced4da;
            padding-left: 15px;
            padding-right: 15px;
            width: 100%;
        }
        .form-control:focus {
            border-color: #dc3545;
            box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.15);
        }
        .form-control-placeholder {
            position: absolute;
            top: 13px;
            left: 15px;
            color: #6c757d;
            transition: all 0.2s;
            pointer-events: none;
            margin-bottom: 0;
            background: #fff;
            padding: 0 4px;
        }
        .form-control:focus + .form-control-placeholder,
        .form-control:not(:placeholder-shown) + .form-control-placeholder {
            top: -10px;
            left: 12px;
            font-size: 12px;
            color: #dc3545;
            font-weight: 700;
        }
        .btn.btn-primary {
            background: #dc3545 !important;
            border-color: #dc3545 !important;
            color: #fff;
            height: 48px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 6px;
            letter-spacing: 0.5px;
            transition: all 0.2s;
        }
        .btn.btn-primary:hover {
            background: #b02a37 !important;
            border-color: #b02a37 !important;
        }
    </style>
</head>
<body>
    <section class="ftco-section py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-7 col-lg-5">
                    <div class="wrap">
                        <!-- Banner Ảnh Đăng Ký (Đã gỡ badge che ảnh) -->
                        <div class="img" th:style="'background-image: url(' + @{/images/bg_1.jpg} + ');'" 
                             style="background-image: url('/images/bg_1.jpg');"></div>

                        <div class="login-wrap">
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <h3 class="font-weight-bold mb-0 text-dark">Tạo Tài Khoản</h3>
                                <a th:href="@{/}" class="text-secondary small font-weight-bold text-decoration-none">
                                    <i class="bi bi-house-door-fill"></i> Trang chủ
                                </a>
                            </div>

                            <div th:if="${errorMsg}" class="alert alert-danger py-2 small font-weight-bold text-center" th:text="${errorMsg}"></div>

                            <form th:action="@{/auth/register}" method="post" th:object="${registerDto}">
                                <!-- 1. Tên đăng nhập -->
                                <div class="form-group">
                                    <input type="text" class="form-control" th:field="*{username}" id="regUsername" placeholder=" " required autofocus>
                                    <label class="form-control-placeholder" for="regUsername">Tên đăng nhập (*)</label>
                                </div>

                                <!-- 2. Mật khẩu -->
                                <div class="form-group">
                                    <input type="password" class="form-control" th:field="*{password}" id="regPassword" placeholder=" " minlength="6" required>
                                    <label class="form-control-placeholder" for="regPassword">Mật khẩu (Tối thiểu 6 ký tự) (*)</label>
                                </div>

                                <!-- 3. Họ và tên -->
                                <div class="form-group">
                                    <input type="text" class="form-control" th:field="*{fullName}" id="regFullName" placeholder=" " required>
                                    <label class="form-control-placeholder" for="regFullName">Họ và tên (*)</label>
                                </div>

                                <!-- 4. Số điện thoại -->
                                <div class="form-group">
                                    <input type="tel" class="form-control" th:field="*{phoneNumber}" id="regPhone" placeholder=" " required>
                                    <label class="form-control-placeholder" for="regPhone">Số điện thoại (*)</label>
                                </div>

                                <!-- 5. Địa chỉ Gmail -->
                                <div class="form-group">
                                    <input type="email" class="form-control" th:field="*{email}" id="regEmail" placeholder=" " required>
                                    <label class="form-control-placeholder" for="regEmail">Địa chỉ Gmail (*)</label>
                                </div>

                                <!-- Nút Đăng Ký -->
                                <div class="form-group mt-4 mb-2">
                                    <button type="submit" class="form-control btn btn-primary submit px-3 shadow-sm">
                                        XÁC NHẬN ĐĂNG KÝ
                                    </button>
                                </div>
                            </form>

                            <p class="text-center text-muted small mt-4 mb-0">
                                Đã có tài khoản? 
                                <a th:href="@{/auth/login}" class="text-danger font-weight-bold text-decoration-none">Đăng nhập ngay</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
