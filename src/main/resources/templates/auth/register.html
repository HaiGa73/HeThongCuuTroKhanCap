<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản Công Dân</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card bg-secondary text-white shadow-lg border-0">
                <div class="card-header bg-warning text-dark text-center py-3">
                    <h4 class="fw-bold mb-0">ĐĂNG KÝ TÀI KHOẢN</h4>
                    <small>Dành cho công dân & tình nguyện viên</small>
                </div>
                <div class="card-body p-4">
                    <div th:if="${errorMsg}" class="alert alert-danger py-2 small fw-bold text-center" th:text="${errorMsg}"></div>

                    <form th:action="@{/auth/register}" method="post" th:object="${registerDto}">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Tên đăng nhập (*):</label>
                            <input type="text" class="form-control bg-dark text-white border-0" th:field="*{username}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Mật khẩu (*):</label>
                            <input type="password" class="form-control bg-dark text-white border-0" th:field="*{password}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Họ và tên (*):</label>
                            <input type="text" class="form-control bg-dark text-white border-0" th:field="*{fullName}" placeholder="VD: Lê Hữu Hải" required>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Số điện thoại (*):</label>
                                <input type="tel" class="form-control bg-dark text-white border-0" th:field="*{phoneNumber}" placeholder="0912345678" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Email:</label>
                                <input type="email" class="form-control bg-dark text-white border-0" th:field="*{email}" placeholder="hai@gmail.com">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-warning w-100 fw-bold py-2 shadow">
                            XÁC NHẬN ĐĂNG KÝ
                        </button>
                    </form>

                    <div class="mt-3 text-center small">
                        <span class="text-light">Đã có tài khoản?</span>
                        <a href="/auth/login" class="text-warning fw-bold text-decoration-none">Đăng nhập</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
