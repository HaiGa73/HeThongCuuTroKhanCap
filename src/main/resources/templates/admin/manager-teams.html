<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Đội Cứu Trợ Thuộc Quyền</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background: #f8fafc; font-family: system-ui, sans-serif; }
    </style>
</head>
<body>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <a href="/admin/users" class="btn btn-outline-secondary btn-sm mb-2">
                <i class="bi bi-arrow-left"></i> Quay Lại Danh Sách Người Dùng
            </a>
            <h4 class="fw-bold text-dark mb-0">
                <i class="bi bi-shield-shaded text-danger me-2"></i>Các Đội Cứu Trợ Thuộc Quyền: 
                <span class="text-primary" th:text="${manager.fullName}">Chỉ huy</span> 
                (<span class="text-muted" th:text="'@' + ${manager.username}"></span>)
            </h4>
        </div>
        <button class="btn btn-danger fw-bold rounded-pill px-3 shadow-sm" data-bs-toggle="modal" data-bs-target="#addTeamModal">
            <i class="bi bi-plus-circle me-1"></i> Thêm Đội Mới Cho Manager
        </button>
    </div>

    <!-- Thông báo kết quả -->
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show fw-bold text-center">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show fw-bold text-center">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Bảng danh sách các đội -->
    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-body p-0 table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th style="width: 70px;" class="text-center">ID</th>
                        <th>Tên Đội Cứu Hộ</th>
                        <th>Đội Trưởng</th>
                        <th>Số Điện Thoại Liên Hệ</th>
                        <th class="text-center">Trạng Thái Sẵn Sàng</th>
                        <th class="text-center" style="width: 150px;">Thao Tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${teams == null or teams.isEmpty()}">
                        <td colspan="6" class="text-center py-4 text-muted">Manager này hiện chưa được phân công đội cứu hộ nào.</td>
                    </tr>
                    <tr th:each="team : ${teams}">
                        <td class="text-center fw-bold" th:text="'#' + ${team.teamId}">#1</td>
                        <td>
                            <div class="fw-bold text-danger fs-6">
                                <i class="bi bi-life-preserver me-1"></i><span th:text="${team.teamName}"></span>
                            </div>
                        </td>
                        <td>
                            <div class="fw-semibold text-dark" th:text="${team.leaderName}">Đ/c Tuấn</div>
                        </td>
                        <td>
                            <a th:href="'tel:' + ${team.contactPhone}" class="text-decoration-none fw-bold text-primary" th:text="${team.contactPhone}">0981010001</a>
                        </td>
                        <td class="text-center">
                            <span th:if="${team.status == 'READY'}" class="badge bg-success px-3 py-2 rounded-pill">SẴN SÀNG</span>
                            <span th:unless="${team.status == 'READY'}" class="badge bg-warning text-dark px-3 py-2 rounded-pill" th:text="${team.status}">BẬN</span>
                        </td>
                        <td class="text-center">
                            <div class="d-flex justify-content-center gap-1">
                                <!-- Nút Sửa: Dùng thuộc tính data-* thay vì nối chuỗi trong onclick -->
                                <button type="button" class="btn btn-outline-primary btn-sm rounded-pill"
                                        th:data-id="${team.teamId}"
                                        th:data-name="${team.teamName}"
                                        th:data-leader="${team.leaderName}"
                                        th:data-phone="${team.contactPhone}"
                                        th:data-status="${team.status}"
                                        onclick="openEditModal(this)">
                                    <i class="bi bi-pencil-square"></i> Sửa
                                </button>
                                
                                <!-- Form Xóa -->
                                <form th:action="@{/admin/users/manager/{id}/teams/{teamId}/delete(id=${managerId}, teamId=${team.teamId})}" 
                                      method="post" onsubmit="return confirm('Bạn có chắc chắn muốn xóa đội cứu nạn này?');">
                                    <button type="submit" class="btn btn-outline-danger btn-sm rounded-pill">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal Thêm Đội -->
<div class="modal fade" id="addTeamModal" tabindex="-1">
    <div class="modal-dialog">
        <form th:action="@{/admin/users/manager/{id}/teams/add(id=${managerId})}" method="post" class="modal-content">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title fw-bold">Thêm Đội Cứu Hộ Mới</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label fw-bold">Tên đội (*)</label>
                    <input type="text" name="teamName" class="form-control" placeholder="VD: Đội Cano Phản Ứng Nhanh 19" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Đội trưởng (*)</label>
                    <input type="text" name="leaderName" class="form-control" placeholder="VD: Đ/c Minh" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Số điện thoại liên lạc (*)</label>
                    <input type="tel" name="contactPhone" class="form-control" placeholder="098..." required>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary rounded-pill" data-bs-dismiss="modal">Đóng</button>
                <button type="submit" class="btn btn-danger rounded-pill fw-bold">Lưu Đội Mới</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal Sửa Đội -->
<div class="modal fade" id="editTeamModal" tabindex="-1">
    <div class="modal-dialog">
        <form id="editForm" method="post" class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title fw-bold">Cập Nhật Thông Tin Đội</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label fw-bold">Tên đội (*)</label>
                    <input type="text" id="eTeamName" name="teamName" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Đội trưởng (*)</label>
                    <input type="text" id="eLeaderName" name="leaderName" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Số điện thoại (*)</label>
                    <input type="tel" id="ePhone" name="contactPhone" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Trạng thái</label>
                    <select id="eStatus" name="status" class="form-select">
                        <option value="READY">SẴN SÀNG (READY)</option>
                        <option value="BUSY">ĐANG LÀM NHIỆM VỤ (BUSY)</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary rounded-pill" data-bs-dismiss="modal">Đóng</button>
                <button type="submit" class="btn btn-primary rounded-pill fw-bold">Cập Nhật</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    const currentManagerId = /*[[${managerId}]]*/ 0;
    const editModal = new bootstrap.Modal(document.getElementById('editTeamModal'));

    function openEditModal(btn) {
        const teamId = btn.getAttribute('data-id');
        const name = btn.getAttribute('data-name');
        const leader = btn.getAttribute('data-leader');
        const phone = btn.getAttribute('data-phone');
        const status = btn.getAttribute('data-status');

        document.getElementById('editForm').action = '/admin/users/manager/' + currentManagerId + '/teams/' + teamId + '/update';
        document.getElementById('eTeamName').value = name || '';
        document.getElementById('eLeaderName').value = leader || '';
        document.getElementById('ePhone').value = phone || '';
        document.getElementById('eStatus').value = status || 'READY';
        editModal.show();
    }
</script>
</body>
</html>
