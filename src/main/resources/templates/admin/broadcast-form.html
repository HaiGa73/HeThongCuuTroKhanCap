<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trung Tâm Phát Cảnh Báo Khẩn Cấp Diện Rộng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body class="bg-dark text-white">

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom border-secondary">
        <h4 class="fw-bold mb-0 text-danger">📢 TRUNG TÂM PHÁT CẢNH BÁO THIÊN TAI KHẨN CẤP</h4>
        <div class="gap-2 d-flex">
            <a href="/survival-guide" class="btn btn-outline-info btn-sm">📖 Xem Cẩm Nang</a>
            <a href="/map" class="btn btn-outline-light btn-sm">🗺️ Xem Bản Đồ</a>
            <a href="/manager/dashboard" class="btn btn-primary btn-sm">🚨 Dashboard Cứu Nạn</a>
        </div>
    </div>

    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show fw-bold text-center" role="alert">
        <span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4">
        <!-- Form Soạn Tin Bắn Cảnh Báo Khẩn Cấp -->
        <div class="col-lg-5">
            <div class="card bg-secondary text-white shadow border-danger">
                <div class="card-header bg-danger text-white fw-bold py-3">
                    <h5 class="mb-0">🚨 BẮN CẢNH BÁO TỨC THỜI (BROADCAST)</h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/alerts/broadcast}" method="post" th:object="${alertDto}">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Mức độ cảnh báo (*):</label>
                            <select class="form-select bg-dark text-white border-0" th:field="*{severity}">
                                <option value="EXTREME">🔴 CỰC KỲ NGUY HIỂM (Vỡ đê / Lũ quét cấp tập)</option>
                                <option value="DANGER" selected>🟠 NGUY HIỂM (Xả lũ khẩn cấp / Triều cường cao)</option>
                                <option value="WARNING">🟡 CẢNH BÁO (Mưa lớn kéo dài / Nguy cơ sạt lở)</option>
                                <option value="INFO">🔵 THÔNG TIN (Thời tiết / Tuyến đường thông xe)</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Tiêu đề cảnh báo (*):</label>
                            <input type="text" class="form-control bg-dark text-white border-0" th:field="*{title}" 
                                   placeholder="VD: CẢNH BÁO KHẨN CẤP: HỒ XẢ LŨ 1.500 M3/S" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Nội dung chỉ đạo & Hướng dẫn (*):</label>
                            <textarea class="form-control bg-dark text-white border-0" th:field="*{content}" rows="4"
                                      placeholder="VD: Dự kiến nước sông dâng cao thêm 1.5m trong 2 giờ tới. Toàn bộ người dân vùng trũng khẩn trương di tản lên các điểm sơ tán trên cao!" required></textarea>
                        </div>

                        <button type="submit" class="btn btn-danger btn-lg w-100 fw-bold shadow py-2"
                                onclick="return confirm('Bạn có chắc chắn muốn BẮN CẢNH BÁO này đến toàn bộ người dùng đang online không?')">
                            🚀 PHÁT TÍN HIỆU CẢNH BÁO NGAY
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Lịch Sử Các Bản Tin Cảnh Báo Đã Bắn -->
        <div class="col-lg-7">
            <div class="card bg-secondary text-white shadow">
                <div class="card-header fw-bold">
                    Lịch Sử Các Bản Tin Cảnh Báo Đã Ban Hành
                </div>
                <div class="card-body p-0 table-responsive">
                    <table class="table table-dark table-hover table-bordered mb-0 align-middle">
                        <thead>
                            <tr class="text-center">
                                <th style="width: 70px;">Mã</th>
                                <th style="width: 130px;">Cấp độ</th>
                                <th>Tiêu đề & Nội dung</th>
                                <th style="width: 140px;">Thời gian</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${alertHistory.isEmpty()}">
                                <td colspan="4" class="text-center text-muted py-4">Chưa có bản tin cảnh báo nào được phát ra.</td>
                            </tr>
                            <tr th:each="a : ${alertHistory}">
                                <td class="text-center fw-bold" th:text="'#' + ${a.alertId}">#1</td>
                                <td class="text-center">
                                    <span class="badge" th:classappend="${a.severity == 'EXTREME' or a.severity == 'DANGER' ? 'bg-danger' : (a.severity == 'WARNING' ? 'bg-warning text-dark' : 'bg-info text-dark')}"
                                          th:text="${a.severity}">DANGER</span>
                                </td>
                                <td>
                                    <div class="fw-bold text-warning" th:text="${a.title}">Tiêu đề</div>
                                    <small class="text-light" th:text="${a.content}">Nội dung</small>
                                </td>
                                <td class="text-center small text-muted" th:text="${#temporals.format(a.createdAt, 'HH:mm dd/MM/yyyy')}">Thời gian</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
