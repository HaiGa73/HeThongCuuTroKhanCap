<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ Sơ Chi Tiết Người Dùng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <a href="/admin/users" class="btn btn-outline-secondary btn-sm mb-3"><i class="bi bi-arrow-left"></i> Quay Lại Danh Sách</a>

    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show fw-bold text-center">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4">
        <!-- Cột thông tin cá nhân & chỉnh sửa -->
        <div class="col-lg-5">
            <div class="card border-0 shadow-sm rounded-3 p-4 bg-white">
                <h5 class="fw-bold text-primary border-bottom pb-2 mb-3">👤 Thông Tin Tài Khoản #<span th:text="${user.userId}"></span></h5>
                <form th:action="@{/admin/users/{id}/detail/update(id=${user.userId})}" method="post">
                    <div class="mb-3">
                        <label class="form-label text-muted small">Tên đăng nhập (Username):</label>
                        <input type="text" class="form-control bg-light fw-bold" th:value="${user.username}" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted small">Họ và tên (*):</label>
                        <input type="text" name="fullName" class="form-control fw-semibold" th:value="${user.fullName}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted small">Email liên hệ (*):</label>
                        <input type="email" name="email" class="form-control" th:value="${user.email}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted small">Số điện thoại (*):</label>
                        <input type="tel" name="phoneNumber" class="form-control" th:value="${user.phoneNumber}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted small">Trạng thái:</label>
                        <div>
                            <span th:if="${user.isActive}" class="badge bg-success">ĐANG HOẠT ĐỘNG</span>
                            <span th:unless="${user.isActive}" class="badge bg-danger">BỊ KHÓA</span>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold">💾 Lưu Cập Nhật Thông Tin</button>
                </form>
            </div>
        </div>

        <!-- Cột lịch sử các ca SOS của người dùng này -->
        <div class="col-lg-7">
            <div class="card border-0 shadow-sm rounded-3 p-4 bg-white">
                <h5 class="fw-bold text-danger border-bottom pb-2 mb-3">🚨 Lịch Sử Ca Cứu Nạn Đã Gửi</h5>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Mã SOS</th>
                                <th>Địa Chỉ Hiện Trường</th>
                                <th>Mức Độ</th>
                                <th>Trạng Thái</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${sosList == null or sosList.isEmpty()}">
                                <td colspan="4" class="text-center py-4 text-muted">Người dùng này chưa tạo yêu cầu cứu hộ nào.</td>
                            </tr>
                            <tr th:each="s : ${sosList}">
                                <td class="fw-bold text-danger" th:text="'#SOS-' + ${s.sosId}">#1</td>
                                <td>
                                    <div class="fw-semibold text-dark small" th:text="${s.addressDetail}">Xã Nam Cường</div>
                                    <div class="text-muted small" th:text="${s.description}">Mô tả...</div>
                                </td>
                                <td><span class="badge bg-danger" th:text="${s.priority}">CRITICAL</span></td>
                                <td><span class="badge bg-secondary" th:text="${s.status}">PENDING</span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
