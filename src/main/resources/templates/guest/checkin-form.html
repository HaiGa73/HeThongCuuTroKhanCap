<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Điểm Danh An Toàn - Safe Check-in</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow-lg border-0">
                <div class="card-header bg-success text-white text-center py-3">
                    <h4 class="mb-0 fw-bold">💚 ĐIỂM DANH AN TOÀN (SAFE CHECK-IN)</h4>
                </div>
                <div class="card-body p-4">
                    <p class="text-muted small">Hãy khai báo nếu bạn vừa thoát khỏi vùng ngập lũ để người thân an tâm và giảm áp lực tìm kiếm cho đội cứu hộ.</p>

                    <form th:action="@{/relatives/checkin}" method="post" th:object="${checkinDto}">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Họ và tên của bạn (*):</label>
                            <input type="text" class="form-control" th:field="*{fullName}" placeholder="VD: Nguyễn Văn A" required>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Số điện thoại:</label>
                                <input type="tel" class="form-control" th:field="*{phoneNumber}" placeholder="VD: 0912345678">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Số CCCD / CMND:</label>
                                <input type="text" class="form-control" th:field="*{idCardNumber}" placeholder="VD: 038096000000">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Quê quán / Nơi ở trước khi di tản:</label>
                            <input type="text" class="form-control" th:field="*{originAddress}" placeholder="VD: Thôn 3, Xã Tân Hưng...">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold text-success">Bạn đang tạm trú tại Điểm Sơ Tán nào?</label>
                            <select class="form-select" th:field="*{shelterId}">
                                <option value="">-- Nếu ở ngoài trạm, hãy bỏ trống mục này --</option>
                                <option th:each="s : ${shelters}" th:value="${s.shelterId}" th:text="${s.name} + ' (' + ${s.address} + ')'"></option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Địa chỉ nơi tạm trú ngoài (nhà bà con, trường học khác...):</label>
                            <input type="text" class="form-control" th:field="*{temporaryAddress}" placeholder="Điền nếu không ở trạm sơ tán tập trung">
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Tình trạng sức khỏe:</label>
                            <input type="text" class="form-control" th:field="*{healthStatus}" value="Bình thường / Sức khỏe ổn định">
                        </div>

                        <div class="d-flex gap-2">
                            <a href="/relatives/search" class="btn btn-secondary w-50">Quay lại</a>
                            <button type="submit" class="btn btn-success fw-bold w-50 shadow">Xác nhận An Toàn</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
