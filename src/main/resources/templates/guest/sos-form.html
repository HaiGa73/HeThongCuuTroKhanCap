<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cứu Nạn Khẩn Cấp - Gửi SOS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 280px; width: 100%; border-radius: 8px; }
    </style>
</head>
<body class="bg-light">

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-lg border-danger">
                <div class="card-header bg-danger text-white text-center py-3">
                    <h4 class="mb-0 fw-bold">🚨 BÁO NẠN KHẨN CẤP (SOS)</h4>
                </div>
                <div class="card-body p-4">
                    <div th:if="${successMsg}" class="alert alert-success fw-bold" role="alert" th:text="${successMsg}"></div>

                    <form th:action="@{/sos/send}" method="post" enctype="multipart/form-data" th:object="${sosDto}">
                        <!-- Tọa độ GPS ẩn -->
                        <input type="hidden" id="latitude" th:field="*{latitude}">
                        <input type="hidden" id="longitude" th:field="*{longitude}">

                        <div class="mb-3 text-center">
                            <button type="button" class="btn btn-warning w-100 fw-bold" onclick="getLocation()">
                                📍 Nhấn để lấy tọa độ GPS tự động
                            </button>
                            <small id="gpsStatus" class="text-muted d-block mt-1">Chưa lấy được tọa độ</small>
                        </div>

                        <div id="map" class="mb-3"></div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Số điện thoại liên hệ (*):</label>
                            <input type="tel" class="form-control" th:field="*{phoneNumber}" placeholder="VD: 0912345678" required>
                        </div>

                        <div class="row mb-3">
                            <div class="col">
                                <label class="form-label">Họ tên:</label>
                                <input type="text" class="form-control" th:field="*{senderName}" placeholder="Tùy chọn">
                            </div>
                            <div class="col">
                                <label class="form-label">Số người kẹt:</label>
                                <input type="number" class="form-control" th:field="*{numberOfPeople}" value="1" min="1">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Địa chỉ chi tiết (nếu biết):</label>
                            <input type="text" class="form-control" th:field="*{addressDetail}" placeholder="VD: Mái nhà số 12 ngõ 3...">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Mô tả tình trạng hiện trường:</label>
                            <textarea class="form-control" th:field="*{description}" rows="3" placeholder="Nước dâng đến đâu? Có người già, trẻ nhỏ hoặc chấn thương không?"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Ảnh chụp hiện trường / Mực nước:</label>
                            <input type="file" class="form-control" name="files" multiple accept="image/*,audio/*">
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" th:field="*{isUrgent}" id="urgentCheck" checked>
                            <label class="form-check-label text-danger fw-bold" for="urgentCheck">
                                Tình trạng cực kỳ nguy cấp (Nhà sắp sập / Ngập nóc)
                            </label>
                        </div>

                        <button type="submit" class="btn btn-danger btn-lg w-100 fw-bold shadow">
                            🚀 GỬI TÍN HIỆU CỨU NẠN NGAY
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let map = L.map('map').setView([16.047079, 108.206230], 6); // Mặc định giữa Việt Nam
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    let marker;

    function getLocation() {
        const gpsStatus = document.getElementById("gpsStatus");
        if (navigator.geolocation) {
            gpsStatus.innerText = "Đang quét tín hiệu vệ tinh...";
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    document.getElementById("latitude").value = lat;
                    document.getElementById("longitude").value = lng;
                    gpsStatus.innerText = `Đã bắt tọa độ: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;

                    map.setView([lat, lng], 16);
                    if (marker) map.removeLayer(marker);
                    marker = L.marker([lat, lng], {draggable: true}).addTo(map);

                    marker.on('dragend', function (e) {
                        const newPos = marker.getLatLng();
                        document.getElementById("latitude").value = newPos.lat;
                        document.getElementById("longitude").value = newPos.lng;
                        gpsStatus.innerText = `Đã chỉnh tọa độ: ${newPos.lat.toFixed(5)}, ${newPos.lng.toFixed(5)}`;
                    });
                },
                (err) => {
                    gpsStatus.innerText = "Không lấy được GPS. Hãy bật Vị trí trên trình duyệt!";
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        } else {
            gpsStatus.innerText = "Trình duyệt không hỗ trợ GPS.";
        }
    }
</script>
</body>
</html>
