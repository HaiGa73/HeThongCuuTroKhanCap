<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Tín Hiệu SOS Cứu Nạn Khẩn Cấp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #mapPicker { height: 260px; width: 100%; border-radius: 8px; border: 2px solid #dc3545; }
    </style>
</head>
<body class="bg-dark text-white">

<nav class="navbar navbar-expand-lg navbar-dark bg-secondary">
    <div class="container">
        <a class="navbar-brand fw-bold text-danger" href="/">🆘 CỨU NẠN THIÊN TAI</a>
        <div class="navbar-nav ms-auto gap-2">
            <a class="btn btn-outline-light btn-sm" href="/map">🗺️ Bản đồ cứu nạn</a>
            <a class="btn btn-outline-info btn-sm" href="/survival-guide">📖 Cẩm nang</a>
            <a class="btn btn-warning btn-sm" href="/auth/login">🔑 Đăng nhập</a>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card bg-secondary text-white shadow-lg border-danger">
                <div class="card-header bg-danger text-center py-3">
                    <h3 class="fw-bold mb-0">🚨 YÊU CẦU ỨNG CỨU KHẨN CẤP (SOS)</h3>
                    <small>Dữ liệu được chuyển thẳng tới ca trực điều phối cứu nạn</small>
                </div>
                <div class="card-body p-4">
                    <div th:if="${successMsg}" class="alert alert-success fw-bold text-center" th:text="${successMsg}"></div>

                    <form th:action="@{/sos}" method="post" enctype="multipart/form-data" th:object="${sosDto}">
                        
                        <!-- 1. Tọa độ định vị GPS -->
                        <div class="mb-3">
                            <label class="form-label fw-bold text-warning">1. Vị trí cần cứu nạn (Chấm chọn hoặc bấm Bắt GPS):</label>
                            <div class="d-flex gap-2 mb-2">
                                <button type="button" class="btn btn-danger btn-sm fw-bold" onclick="getLocation()">
                                    📍 Lấy Vị Trí Hiện Tại Của Tôi
                                </button>
                                <span class="small text-light align-self-center" id="geo-status">Chưa lấy GPS</span>
                            </div>
                            <div id="mapPicker" class="mb-2"></div>
                            
                            <div class="row g-2">
                                <div class="col-6">
                                    <input type="text" class="form-control bg-dark text-white border-0" 
                                           th:field="*{latitude}" id="latInput" placeholder="Vĩ độ (Latitude)" required readonly>
                                </div>
                                <div class="col-6">
                                    <input type="text" class="form-control bg-dark text-white border-0" 
                                           th:field="*{longitude}" id="lngInput" placeholder="Kinh độ (Longitude)" required readonly>
                                </div>
                            </div>
                        </div>

                        <!-- 2. Thông tin liên hệ -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Họ và tên người gọi cứu (*):</label>
                                <input type="text" class="form-control bg-dark text-white border-0" 
                                       th:field="*{senderName}" placeholder="VD: Nguyễn Văn A" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Số điện thoại liên lạc (*):</label>
                                <input type="tel" class="form-control bg-dark text-white border-0" 
                                       th:field="*{phoneNumber}" placeholder="VD: 0912345678" required>
                            </div>
                        </div>

                        <!-- 3. Địa chỉ chi tiết -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Địa chỉ chi tiết / Cột mốc dễ tìm (*):</label>
                            <input type="text" class="form-control bg-dark text-white border-0" 
                                   th:field="*{addressDetail}" placeholder="VD: Số nhà 12, ngập tới mái ngói, gần trạm biến áp..." required>
                        </div>

                        <!-- 4. Số người & Mức độ khẩn cấp -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Số người mắc kẹt:</label>
                                <input type="number" class="form-control bg-dark text-white border-0" 
                                       th:field="*{numberOfPeople}" value="1" min="1" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold text-danger">Mức độ nguy cấp:</label>
                                <select class="form-select bg-dark text-white border-0" th:field="*{priority}">
                                    <option value="CRITICAL">🔴 CỰC KỲ NGUY HIỂM (Nước ngập mái/Có người bị thương)</option>
                                    <option value="HIGH" selected>🟠 NGUY HIỂM CAO (Nước dâng nhanh/Có người già, trẻ nhỏ)</option>
                                    <option value="MEDIUM">🟡 TRUNG BÌNH (Hết lương thực/Nước sạch)</option>
                                    <option value="LOW">🔵 CẦN HỖ TRỢ DI TẢN</option>
                                </select>
                            </div>
                        </div>

                        <!-- 5. Tải ảnh hiện trường -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Hình ảnh hiện trường (Tải lên Cloudinary):</label>
                            <input type="file" class="form-control bg-dark text-white border-0" 
                                   th:field="*{files}" multiple accept="image/*">
                        </div>

                        <!-- 6. Mô tả hiện trường -->
                        <div class="mb-4">
                            <label class="form-label fw-bold">Tình trạng cụ thể:</label>
                            <textarea class="form-control bg-dark text-white border-0" 
                                      th:field="*{description}" rows="3" placeholder="Mô tả mức nước ngập, có người già hoặc em bé hay không..."></textarea>
                        </div>

                        <button type="submit" class="btn btn-danger btn-lg w-100 fw-bold shadow py-3">
                            🚀 GỬI TÍN HIỆU CỨU NẠN NGAY LẬP TỨC
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const defaultLat = 10.8500;
    const defaultLng = 107.3800;

    const map = L.map('mapPicker').setView([defaultLat, defaultLng], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    let marker = L.marker([defaultLat, defaultLng], { draggable: true }).addTo(map);

    function updateInputs(lat, lng) {
        document.getElementById('latInput').value = Number(lat).toFixed(6);
        document.getElementById('lngInput').value = Number(lng).toFixed(6);
    }
    updateInputs(defaultLat, defaultLng);

    marker.on('dragend', function (e) {
        const pos = e.target.getLatLng();
        updateInputs(pos.lat, pos.lng);
    });

    map.on('click', function (e) {
        marker.setLatLng(e.latlng);
        updateInputs(e.latlng.lat, e.latlng.lng);
    });

    function getLocation() {
        const status = document.getElementById('geo-status');
        if (navigator.geolocation) {
            status.innerText = 'Đang bắt tín hiệu vệ tinh...';
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    map.setView([lat, lng], 16);
                    marker.setLatLng([lat, lng]);
                    updateInputs(lat, lng);
                    status.innerText = 'Đã định vị chính xác!';
                    status.className = 'small text-success fw-bold align-self-center';
                },
                (err) => {
                    status.innerText = 'Không lấy được GPS tự động. Hãy kéo thả mốc trên bản đồ.';
                    status.className = 'small text-warning align-self-center';
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        } else {
            status.innerText = 'Trình duyệt không hỗ trợ Geolocation.';
        }
    }
</script>
</body>
</html>
