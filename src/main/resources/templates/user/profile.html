<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ Sơ Cá Nhân - Cứu Nạn Thiên Tai</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background-color: #f1f5f9; font-family: system-ui, sans-serif; }
        .profile-card { background: #ffffff; border-radius: 16px; border: 0; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        .form-control-locked {
            background-color: #f8fafc !important;
            color: #64748b !important;
            cursor: not-allowed;
            border-color: #e2e8f0;
        }
        .avatar-preview {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #dc3545;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-danger px-4 shadow-sm">
    <a class="navbar-brand fw-bold" href="/">
        <i class="bi bi-shield-shaded me-2"></i>CỨU NẠN THIÊN TAI
    </a>
    <div class="ms-auto d-flex align-items-center gap-3">
        <a href="/" class="btn btn-outline-light btn-sm rounded-pill"><i class="bi bi-house-door"></i> Trang Chủ</a>
        <a href="/auth/logout" class="btn btn-dark btn-sm rounded-pill"><i class="bi bi-box-arrow-right"></i> Đăng Xuất</a>
    </div>
</nav>

<div class="container py-5" style="max-width: 720px;">
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show fw-bold text-center rounded-3 shadow-sm">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show fw-bold text-center rounded-3 shadow-sm">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="profile-card p-4 p-md-5">
        <!-- Khung hiển thị Avatar hiện tại -->
        <div class="d-flex align-items-center gap-3 mb-4 border-bottom pb-4">
            <div>
                <img th:if="${user.avatarUrl != null and !user.avatarUrl.isBlank()}" 
                     th:src="${user.avatarUrl}" alt="Avatar" class="avatar-preview shadow-sm">
                <div th:unless="${user.avatarUrl != null and !user.avatarUrl.isBlank()}" 
                     class="bg-primary-subtle text-primary rounded-circle d-flex align-items-center justify-content-center border" 
                     style="width: 90px; height: 90px; font-size: 2.8rem;">
                    <i class="bi bi-person-circle"></i>
                </div>
            </div>
            <div>
                <h4 class="fw-bold text-dark mb-1" th:text="${user.fullName ?: user.username}">Họ và Tên</h4>
                <div class="small text-muted">
                    <span>Mã tài khoản: <b th:text="'#' + (${user.userId != null ? user.userId : user.id})">#1</b></span> | 
                    <span>Vai trò: <span class="badge bg-secondary" th:text="${user.role}">USER</span></span>
                </div>
            </div>
        </div>

        <!-- QUAN TRỌNG: Form phải có enctype="multipart/form-data" để gửi file ảnh -->
        <form th:action="@{/user/profile/update}" th:object="${profileDto}" method="post" enctype="multipart/form-data">
            
            <h6 class="fw-bold text-secondary text-uppercase small mb-3">1. Thông tin đăng ký cố định (Chỉ xem)</h6>
            
            <!-- Username (Locked) -->
            <div class="mb-3">
                <label class="form-label small fw-semibold text-muted">
                    <i class="bi bi-lock-fill me-1 text-danger"></i>Tên đăng nhập (Username):
                </label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="bi bi-person-fill"></i></span>
                    <input type="text" class="form-control form-control-locked" th:value="${user.username}" readonly>
                </div>
            </div>

            <!-- Phone (Locked) -->
            <div class="mb-3">
                <label class="form-label small fw-semibold text-muted">
                    <i class="bi bi-lock-fill me-1 text-danger"></i>Số điện thoại xác thực lúc đăng ký:
                </label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="bi bi-telephone-fill"></i></span>
                    <input type="text" class="form-control form-control-locked" th:value="${user.phoneNumber ?: 'Chưa thiết lập'}" readonly>
                </div>
            </div>

            <!-- Email (Locked) -->
            <div class="mb-4">
                <label class="form-label small fw-semibold text-muted">
                    <i class="bi bi-lock-fill me-1 text-danger"></i>Địa chỉ Email đăng ký:
                </label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope-fill"></i></span>
                    <input type="email" class="form-control form-control-locked" th:value="${user.email ?: 'Chưa thiết lập'}" readonly>
                </div>
            </div>

            <h6 class="fw-bold text-primary text-uppercase small mb-3 border-top pt-4">2. Thông tin cá nhân có thể thay đổi</h6>

            <!-- Chọn ảnh đại diện mới -->
            <div class="mb-3">
                <label class="form-label fw-bold text-dark">
                    Thay đổi ảnh đại diện (Avatar):
                </label>
                <input type="file" th:field="*{avatarFile}" class="form-control" accept="image/*">
                <small class="text-muted">Chọn ảnh định dạng JPG, PNG để cập nhật ảnh đại diện mới.</small>
            </div>

            <!-- Họ và tên (Editable) -->
            <div class="mb-3">
                <label class="form-label fw-bold text-dark">
                    Họ và tên hiển thị (*):
                </label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-pencil-fill text-primary"></i></span>
                    <input type="text" th:field="*{fullName}" class="form-control border-start-0" 
                           placeholder="Nhập họ và tên đầy đủ..." required>
                </div>
            </div>

            <!-- Địa chỉ nhà (Editable) -->
            <div class="mb-4">
                <label class="form-label fw-bold text-dark">
                    Địa chỉ thường trú / Nơi ở hiện tại:
                </label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-geo-alt-fill text-danger"></i></span>
                    <textarea th:field="*{address}" class="form-control border-start-0" rows="3"
                              placeholder="VD: Số 123, Thôn 4, Xã Nam Cường, Huyện Nam Đàn, Nghệ An"></textarea>
                </div>
            </div>

            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold shadow-sm">
                    <i class="bi bi-check2-circle me-1"></i> Lưu Thay Đổi Hồ Sơ
                </button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
