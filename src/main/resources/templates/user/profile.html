<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ Sơ Cá Nhân - Cứu Nạn Khẩn Cấp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .avatar-preview {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #dc3545;
        }
        .avatar-placeholder {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 4px solid #6c757d;
            background-color: #343a40;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: #ffc107;
            margin: 0 auto;
        }
    </style>
</head>
<body class="bg-dark text-white">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-secondary">
    <div class="container">
        <a class="navbar-brand fw-bold text-danger" href="/">🆘 CỨU NẠN THIÊN TAI</a>
        <div class="navbar-nav ms-auto gap-2 align-items-center">
            <a class="btn btn-outline-light btn-sm" href="/map">🗺️ Bản đồ</a>
            <a class="btn btn-outline-warning btn-sm" href="/user/my-sos">🚨 Ca cứu của tôi</a>
            <a class="btn btn-danger btn-sm" href="/auth/logout">🚪 Đăng xuất</a>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="row g-4 justify-content-center">
        <!-- Cột trái: Tóm tắt thông tin & Avatar -->
        <div class="col-lg-4">
            <div class="card bg-secondary text-white shadow border-0 text-center p-4">
                <div class="mb-3">
                    <img th:if="${user.avatarUrl != null and !user.avatarUrl.isEmpty()}" 
                         th:src="${user.avatarUrl}" 
                         id="avatarImage" class="avatar-preview shadow" alt="Avatar">
                    <div th:if="${user.avatarUrl == null or user.avatarUrl.isEmpty()}" 
                         id="avatarDefault" class="avatar-placeholder shadow">
                        👤
                    </div>
                </div>

                <h4 class="fw-bold mb-1" th:text="${user.fullName}">Lê Hữu Hải</h4>
                <p class="text-warning mb-2">@<span th:text="${user.username}">username</span></p>

                <div class="mb-3">
                    <span th:each="r : ${user.roles}" 
                          class="badge bg-danger me-1 fs-6" 
                          th:text="${r.name}">ROLE_USER</span>
                </div>

                <hr class="border-secondary">

                <div class="text-start small text-light opacity-75">
                    <p class="mb-1"><strong>Trạng thái:</strong> 
                        <span class="badge bg-success" th:if="${user.isActive}">Đã kích hoạt</span>
                        <span class="badge bg-warning text-dark" th:unless="${user.isActive}">Chưa kích hoạt</span>
                    </p>
                    <p class="mb-1"><strong>Ngày tham gia:</strong> 
                        <span th:text="${#temporals.format(user.createdAt, 'dd/MM/yyyy')}">26/10/2026</span>
                    </p>
                    <p class="mb-0"><strong>Email:</strong> <span th:text="${user.email ?: 'Chưa cập nhật'}"></span></p>
                </div>
            </div>
        </div>

        <!-- Cột phải: Form cập nhật thông tin & Đổi mật khẩu -->
        <div class="col-lg-7">
            <!-- 1. Form Cập Nhật Thông Tin Cá Nhân -->
            <div class="card bg-secondary text-white shadow border-0 mb-4">
                <div class="card-header bg-dark fw-bold py-3 text-warning">
                    📝 CẬP NHẬT THÔNG TIN HỒ SƠ
                </div>
                <div class="card-body p-4">
                    <div th:if="${profileSuccessMsg}" class="alert alert-success py-2 small fw-bold text-center" th:text="${profileSuccessMsg}"></div>
                    <div th:if="${profileErrorMsg}" class="alert alert-danger py-2 small fw-bold text-center" th:text="${profileErrorMsg}"></div>

                    <form th:action="@{/user/profile/update}" method="post" enctype="multipart/form-data" th:object="${profileDto}">
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Họ và tên (*):</label>
                                <input type="text" class="form-control bg-dark text-white border-0" 
                                       th:field="*{fullName}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Số điện thoại (*):</label>
                                <input type="tel" class="form-control bg-dark text-white border-0" 
                                       th:field="*{phoneNumber}" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold">Địa chỉ Email:</label>
                            <input type="email" class="form-control bg-dark text-white border-0" 
                                   th:field="*{email}">
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold">Thay đổi ảnh đại diện (Tải lên Cloudinary):</label>
                            <input type="file" class="form-control bg-dark text-white border-0" 
                                   th:field="*{avatarFile}" accept="image/*" onchange="previewFile(this)">
                        </div>

                        <button type="submit" class="btn btn-warning fw-bold px-4 shadow">
                            Lưu Thay Đổi
                        </button>
                    </form>
                </div>
            </div>

            <!-- 2. Form Đổi Mật Khẩu -->
            <div class="card bg-secondary text-white shadow border-0">
                <div class="card-header bg-dark fw-bold py-3 text-danger">
                    🔒 ĐỔI MẬT KHẨU TÀI KHOẢN
                </div>
                <div class="card-body p-4">
                    <div th:if="${pwdSuccessMsg}" class="alert alert-success py-2 small fw-bold text-center" th:text="${pwdSuccessMsg}"></div>
                    <div th:if="${pwdErrorMsg}" class="alert alert-danger py-2 small fw-bold text-center" th:text="${pwdErrorMsg}"></div>

                    <form th:action="@{/user/profile/change-password}" method="post" th:object="${passwordDto}">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Mật khẩu hiện tại (*):</label>
                            <input type="password" class="form-control bg-dark text-white border-0" 
                                   th:field="*{currentPassword}" required>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Mật khẩu mới (*):</label>
                                <input type="password" class="form-control bg-dark text-white border-0" 
                                       th:field="*{newPassword}" minlength="6" placeholder="Tối thiểu 6 ký tự" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Xác nhận mật khẩu mới (*):</label>
                                <input type="password" class="form-control bg-dark text-white border-0" 
                                       th:field="*{confirmPassword}" minlength="6" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-danger fw-bold px-4 shadow">
                            Cập Nhật Mật Khẩu
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function previewFile(input) {
        const file = input.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                let img = document.getElementById('avatarImage');
                let placeholder = document.getElementById('avatarDefault');
                if (img) {
                    img.src = e.target.result;
                } else if (placeholder) {
                    placeholder.outerHTML = '<img src="' + e.target.result + '" id="avatarImage" class="avatar-preview shadow" alt="Avatar">';
                }
            };
            reader.readAsDataURL(file);
        }
    }
</script>
</body>
</html>
