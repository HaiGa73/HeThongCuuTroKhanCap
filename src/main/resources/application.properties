server.port=8080

# --- SQL Server 2022 Configuration ---
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=DisasterRescueDB;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate Properties
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# --- Giới hạn file tải lên (ảnh/ghi âm hiện trường) ---
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# --- Cloudinary Credentials ---
cloudinary.cloud-name=your_cloud_name
cloudinary.api-key=your_api_key
cloudinary.api-secret=your_api_secret

# --- JWT Configuration ---
# Secret key tối thiểu 256-bit dạng Hex hoặc Base64
