<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Login #5</title>
  	<link rel="stylesheet" href="css/style.css">
</head>
  <body>

  <div class="cl-d-md-flex half">
    <div class="bg" style="background-image: url('images/bg_1.jpg');"></div>
    <div class="contents">

      <div class="cl-container">
        <div class="cl-row cl-align-items-center cl-justify-content-center">
          <div class="cl-col-md-12">
            <div class="form-block cl-mx-auto">
              <div class="cl-text-center cl-mb-5">
                <h3 class="cl-text-uppercase">Login to <strong>Colorlib</strong></h3>
              </div>
              <form action="#" method="post">
                <div class="cl-form-group first">
                  <label for="username">Username</label>
                  <input type="text" class="cl-form-control" placeholder="your-email@gmail.com" id="username">
                </div>
                <div class="cl-form-group last cl-mb-3">
                  <label for="password">Password</label>
                  <input type="password" class="cl-form-control" placeholder="Your Password" id="password">
                </div>
                
                <div class="cl-d-sm-flex cl-mb-5 cl-align-items-center">
                  <label class="control control--checkbox cl-mb-3 cl-mb-sm-0"><span class="caption">Remember me</span>
                    <input type="checkbox" checked="checked"/>
                    <div class="control__indicator"></div>
                  </label>
                  <span class="cl-ml-auto"><a href="#" class="forgot-pass">Forgot Password</a></span> 
                </div>

                <input type="submit" value="Log In" class="cl-btn cl-btn-block cl-py-2 cl-btn-primary">

                <span class="cl-text-center cl-my-3 cl-d-block">or</span>

                <div class="">
                <a href="#" class="cl-btn cl-btn-block cl-py-2 btn-facebook">
                  <span class="icon-facebook cl-mr-3"><svg class="cl-icon" viewBox="0 0 602 1024" style="vertical-align:-0.0625em" aria-hidden="true" focusable="false"><g transform="translate(0,960) scale(1,-1)"><path d="M548 944V793H458Q406 793 390.5 770.0Q375 747 375 711V603H542L520 434H375V0H200V434H54V603H200V727Q200 782 216 823Q232 865 260.5 893.5Q289 922 329 936Q369 951 418 951Q464 951 500.0 948.5Q536 946 548 944Z"/></g></svg></span> Login with facebook
                </a>
                <a href="#" class="cl-btn cl-btn-block cl-py-2 btn-google"><span class="icon-google cl-mr-3"><svg class="cl-icon" viewBox="0 0 860 1024" style="vertical-align:-0.0625em" aria-hidden="true" focusable="false"><g transform="translate(0,960) scale(1,-1)"><path d="M439 502H853Q856 485 858.0 467.5Q860 450 860 429Q860 335 830 256Q800 177 744.5 120.5Q689 64 611 32Q534 0 439 0Q348 0 268 34Q188 69 128.5 128.5Q69 188 34 268Q0 348 0 439Q0 530 34 610Q69 690 128.5 749.5Q188 809 268 843Q348 878 439 878Q483 878 524 870Q565 862 602.0 847.0Q639 832 671 811Q704 790 733 763L614 648Q589 672 546.0 694.0Q503 716 439 716Q383 716 333 694Q284 672 247.0 634.5Q210 597 188 547Q167 496 167 439Q167 381 188 331Q210 280 247.0 242.5Q284 205 333 183Q383 162 439 162Q504 162 550 182Q595 203 624.5 232.0Q654 261 669 294Q684 327 688 351H439V502Z"/></g></svg></span> Login with Google</a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

    	<script src="js/snippet.js"></script>
</body>
</html>
